<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 AI Доктор Вася</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #f0f2f5;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 220px;           /* Уменьшили с 280px до 220px */
            min-width: 220px;
            background: #ffffff;
            border-right: 1px solid #e4e6eb;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px 16px 12px;
            border-bottom: 1px solid #e4e6eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h2 {
            font-size: 16px;        /* Уменьшили шрифт */
            font-weight: 700;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sidebar-header .new-chat-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .sidebar-header .new-chat-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-list::-webkit-scrollbar {
            width: 4px;
        }

        .chat-list::-webkit-scrollbar-track {
            background: #f0f2f5;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: #c1c7d0;
            border-radius: 10px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;     /* Уменьшили padding */
            margin-bottom: 4px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            gap: 8px;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
        }

        .chat-item:hover {
            background: #f0f2f5;
        }

        .chat-item.active {
            background: #e7e9f2;
        }

        .chat-item .chat-icon {
            width: 28px;            /* Уменьшили */
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .chat-item .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-item .chat-title {
            font-size: 13px;        /* Уменьшили */
            font-weight: 500;
            color: #1a1a2e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item .chat-preview {
            font-size: 11px;        /* Уменьшили */
            color: #8a8fa3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .chat-item .chat-actions {
            display: none;
            gap: 2px;
        }

        .chat-item:hover .chat-actions {
            display: flex;
        }

        .chat-item .chat-actions button {
            background: none;
            border: none;
            color: #8a8fa3;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.15s;
        }

        .chat-item .chat-actions button:hover {
            background: #e4e6eb;
            color: #1a1a2e;
        }

        .chat-item .chat-actions .delete-btn:hover {
            color: #e74c3c;
        }

        /* ===== CHAT AREA ===== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .chat-header {
            padding: 14px 24px;     /* Уменьшили padding */
            border-bottom: 1px solid #e4e6eb;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            background: #ffffff;
        }

        .chat-header .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .chat-header .chat-title-header {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .chat-header .chat-status {
            font-size: 12px;
            color: #8a8fa3;
            margin-left: auto;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f0f2f5;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #c1c7d0;
            border-radius: 10px;
        }

        .message {
            margin-bottom: 14px;
            padding: 12px 18px;
            border-radius: 16px;
            max-width: 70%;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
            line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background: white;
            color: #1a1a2e;
            border: 1px solid #e9ecef;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message img {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator {
            display: none;
            padding: 8px 0 4px 24px;
            color: #8a8fa3;
            font-style: italic;
            font-size: 13px;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots span {
            display: inline-block;
            animation: dot-bounce 1.4s infinite both;
            font-size: 18px;
            margin: 0 1px;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        .typing-dots span:nth-child(3) { animation-delay: 0s; }

        @keyframes dot-bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* ===== НОВАЯ СТРУКТУРА ВВОДА ===== */
        .input-area {
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;     /* Вертикальное расположение */
            gap: 8px;
            flex-shrink: 0;
            padding: 12px 24px 16px;
        }

        .input-area textarea {
            width: 100%;               /* Растягиваем на всю ширину */
            border: 2px solid #667eea;
            border-radius: 16px;
            font-size: 15px;
            transition: border-color 0.2s, height 0.1s;
            background: #f8f9fa;
            padding: 14px 18px;
            min-height: 48px;
            max-height: 500px;
            outline: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            resize: none;
            line-height: 1.5;
            overflow-y: hidden;
        }

        .input-area textarea:focus {
            border-color: #764ba2;
            background: white;
        }

        .input-area textarea::-webkit-scrollbar {
            width: 6px;
        }

        .input-area textarea::-webkit-scrollbar-track {
            background: #f0f2f5;
            border-radius: 10px;
        }

        .input-area textarea::-webkit-scrollbar-thumb {
            background: #c1c7d0;
            border-radius: 10px;
        }

        .input-area .button-wrapper {
            display: flex;
            justify-content: flex-end;  /* Кнопка справа */
            gap: 10px;
        }

        .input-area button {
            padding: 10px 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #8a8fa3;
            text-align: center;
        }

        .empty-state .empty-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 13px;
            max-width: 280px;
        }

        /* ===== CONTEXT MENU ===== */
        .context-menu {
            display: none;
            position: fixed;
            background: white;
            border-radius: 10px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.12);
            padding: 4px 0;
            min-width: 160px;
            z-index: 2000;
            border: 1px solid #e4e6eb;
        }

        .context-menu.active {
            display: block;
        }

        .context-menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: none;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 13px;
            color: #1a1a2e;
            transition: background 0.15s;
            font-family: inherit;
        }

        .context-menu button:hover {
            background: #f0f2f5;
        }

        .context-menu .delete-context {
            color: #e74c3c;
        }

        .context-menu .delete-context:hover {
            background: #fde8e8;
        }

        /* ===== RENAME MODAL ===== */
        .rename-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }

        .rename-modal.active {
            display: flex;
        }

        .rename-modal-content {
            background: white;
            border-radius: 14px;
            padding: 24px;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 16px 48px rgba(0,0,0,0.2);
        }

        .rename-modal-content h3 {
            margin-bottom: 14px;
            color: #1a1a2e;
            font-size: 17px;
        }

        .rename-modal-content input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e4e6eb;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .rename-modal-content input:focus {
            border-color: #667eea;
        }

        .rename-modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            justify-content: flex-end;
        }

        .rename-modal-actions button {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .rename-modal-actions .btn-cancel {
            background: #f0f2f5;
            color: #1a1a2e;
        }

        .rename-modal-actions .btn-cancel:hover {
            background: #e4e6eb;
        }

        .rename-modal-actions .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .rename-modal-actions .btn-save:hover {
            transform: scale(1.02);
            box-shadow: 0 3px 12px rgba(102, 126, 234, 0.35);
        }
    </style>
</head>
<body>
    <!-- ===== CONTEXT MENU ===== -->
    <div class="context-menu" id="contextMenu">
        <button class="rename-context">✏️ Переименовать</button>
        <button class="delete-context">🗑️ Удалить</button>
    </div>

    <!-- ===== RENAME MODAL ===== -->
    <div class="rename-modal" id="renameModal">
        <div class="rename-modal-content">
            <h3>✏️ Переименовать чат</h3>
            <input type="text" id="renameInput" placeholder="Введите новое название..." />
            <div class="rename-modal-actions">
                <button class="btn-cancel" id="renameCancel">Отмена</button>
                <button class="btn-save" id="renameSave">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>💬 Чаты</h2>
                <button class="new-chat-btn" id="newChatBtn" title="Новый чат">+</button>
            </div>
            <div class="chat-list" id="chatList"></div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="avatar">🩺</div>
                <span class="chat-title-header" id="currentChatTitle">Новый чат</span>
                <span class="chat-status">● онлайн</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">👋</div>
                    <h3>Добро пожаловать!</h3>
                    <p>Начните новый диалог с AI Доктором Васей</p>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                🤔 AI Доктор Вася думает
                <span class="typing-dots">
                    <span>.</span><span>.</span><span>.</span>
                </span>
            </div>

            <!-- ===== НОВАЯ СТРУКТУРА ВВОДА ===== -->
            <div class="input-area">
                <textarea id="userInput" placeholder="Напишите вопрос..." rows="1"></textarea>
                <div class="button-wrapper">
                    <button id="sendButton">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ===== STATE =====
        // ============================================================
        let chats = [];
        let currentChatId = null;
        let contextMenuTarget = null;
        let renameTargetId = null;

        // ============================================================
        // ===== Автоматическое изменение рамки для сообщений =====
        // ============================================================
        function autoResize(textarea) {
            const maxHeight = 500; // Максимальная высота в пикселях
            textarea.style.height = 'auto';
            if (textarea.scrollHeight > maxHeight) {
                textarea.style.height = maxHeight + 'px';
                textarea.style.overflowY = 'auto';  // Включаем прокрутку
            } else {
                textarea.style.height = textarea.scrollHeight + 'px';
                textarea.style.overflowY = 'hidden';  // Скрываем прокрутку
            }
        }

        // ============================================================
        // ===== CHAT CRUD =====
        // ============================================================
        function createNewChat() {
            const chat = {
                id: Date.now().toString(),
                title: `Чат ${chats.length + 1}`,
                messages: [],
                createdAt: new Date().toISOString()
            };
            chats.unshift(chat);
            saveChats();
            return chat;
        }

        function deleteChat(id) {
            if (chats.length <= 1) {
                alert('Нельзя удалить последний чат');
                return;
            }
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) {
                currentChatId = chats[0].id;
            }
            saveChats();
            renderAll();
            closeContextMenu();
        }

        function renameChat(id, newTitle) {
            const chat = chats.find(c => c.id === id);
            if (chat) {
                chat.title = newTitle.trim() || 'Без названия';
                saveChats();
                renderAll();
                closeRenameModal();
            }
        }

        function saveChats() {
            localStorage.setItem('aiDoctorChats', JSON.stringify(chats));
        }

        function loadChats() {
            const saved = localStorage.getItem('aiDoctorChats');
            if (saved) {
                try {
                    chats = JSON.parse(saved);
                    if (!chats.length) createNewChat();
                } catch (e) {
                    createNewChat();
                }
            } else {
                createNewChat();
            }
        }

        // ============================================================
        // ===== RENDER =====
        // ============================================================
        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item${chat.id === currentChatId ? ' active' : ''}`;
                div.dataset.chatId = chat.id;

                const lastMsg = chat.messages.length > 0 ? chat.messages[chat.messages.length - 1] : null;
                const preview = lastMsg ? (lastMsg.text.length > 28 ? lastMsg.text.substring(0, 28) + '...' : lastMsg.text) : 'Новый чат';

                div.innerHTML = `
                    <div class="chat-icon">${chat.title.charAt(0).toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-title">${chat.title}</div>
                        <div class="chat-preview">${preview}</div>
                    </div>
                    <div class="chat-actions">
                        <button class="rename-btn" title="Переименовать">✏️</button>
                        <button class="delete-btn" title="Удалить">🗑️</button>
                    </div>
                `;

                div.addEventListener('click', (e) => {
                    if (e.target.closest('.chat-actions')) return;
                    switchChat(chat.id);
                });

                div.querySelector('.rename-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openRenameModal(chat.id);
                });

                div.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteChat(chat.id);
                });

                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    contextMenuTarget = chat.id;
                    openContextMenu(e.clientX, e.clientY);
                });

                list.appendChild(div);
            });
        }

        function renderMessages() {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            const container = document.getElementById('chatMessages');
            const emptyState = document.getElementById('emptyState');
            
            container.querySelectorAll('.message').forEach(el => el.remove());

            if (chat.messages.length === 0) {
                emptyState.style.display = 'flex';
                return;
            }
            emptyState.style.display = 'none';

            chat.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.type}`;
                div.innerHTML = msg.text.replace(/\n/g, '<br>');
                if (msg.plots && msg.plots.length > 0) {
                    msg.plots.forEach(url => {
                        const img = document.createElement('img');
                        img.src = url;
                        img.alt = 'График';
                        div.appendChild(img);
                    });
                }
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }

        function renderAll() {
            renderChatList();
            renderMessages();
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                document.getElementById('currentChatTitle').textContent = chat.title;
            }
        }

        // ============================================================
        // ===== SWITCH CHAT =====
        // ============================================================
        function switchChat(chatId) {
            currentChatId = chatId;
            renderAll();
            // Сбрасываем высоту textarea при переключении чата
            const input = document.getElementById('userInput');
            input.style.height = 'auto';
        }

        // ============================================================
        // ===== SEND MESSAGE =====
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) {
                console.log('⚠️ Сообщение пустое');
                return;
            }

            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            // ✅ Явно преобразуем chat_id в строку
            const chatIdStr = String(currentChatId);
            console.log('📤 Отправляем сообщение:', message);
            console.log('📤 chat_id:', chatIdStr, 'тип:', typeof chatIdStr);

            chat.messages.push({ type: 'user', text: message, plots: [] });
            saveChats();
            renderAll();

            input.value = '';
            input.style.height = 'auto';  // Сбрасываем высоту
            
            const sendBtn = document.getElementById('sendButton');
            sendBtn.disabled = true;
            document.getElementById('typingIndicator').classList.add('active');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        chat_id: String(currentChatId)  // ← ДОБАВЛЯЕМ chat_id!
                    }),
                });

                const data = await response.json();
                document.getElementById('typingIndicator').classList.remove('active');

                if (response.ok) {
                    chat.messages.push({ 
                        type: 'bot', 
                        text: data.response, 
                        plots: data.plots || [] 
                    });
                } else {
                    chat.messages.push({ 
                        type: 'bot', 
                        text: `❌ Ошибка: ${data.detail || 'Неизвестная ошибка'}`, 
                        plots: [] 
                    });
                }
            } catch (error) {
                document.getElementById('typingIndicator').classList.remove('active');
                chat.messages.push({ 
                    type: 'bot', 
                    text: `❌ Ошибка соединения: ${error.message}`, 
                    plots: [] 
                });
            } finally {
                saveChats();
                renderAll();
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // ============================================================
        // ===== CONTEXT MENU =====
        // ============================================================
        function openContextMenu(x, y) {
            const menu = document.getElementById('contextMenu');
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            menu.classList.add('active');
        }

        function closeContextMenu() {
            document.getElementById('contextMenu').classList.remove('active');
            contextMenuTarget = null;
        }

        // ============================================================
        // ===== RENAME MODAL =====
        // ============================================================
        function openRenameModal(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            renameTargetId = chatId;
            document.getElementById('renameInput').value = chat.title;
            document.getElementById('renameModal').classList.add('active');
            setTimeout(() => document.getElementById('renameInput').focus(), 100);
        }

        function closeRenameModal() {
            document.getElementById('renameModal').classList.remove('active');
            renameTargetId = null;
        }

        function saveRename() {
            const input = document.getElementById('renameInput');
            if (renameTargetId) {
                renameChat(renameTargetId, input.value);
            }
        }

        // ============================================================
        // ===== EVENT LISTENERS =====
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            loadChats();
            if (chats.length > 0) {
                currentChatId = chats[0].id;
            }
            renderAll();

            const userInput = document.getElementById('userInput');
            
            document.getElementById('sendButton').addEventListener('click', sendMessage);
            
            // Автоматическое изменение высоты textarea
            userInput.addEventListener('input', function() {
                autoResize(this);
            });

            // Отключаем Enter (только кнопка отправляет)
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                }
            });

            document.getElementById('newChatBtn').addEventListener('click', () => {
                createNewChat();
                switchChat(chats[0].id);
            });

            document.addEventListener('click', (e) => {
                if (!document.getElementById('contextMenu').contains(e.target)) {
                    closeContextMenu();
                }
            });

            document.querySelector('.rename-context').addEventListener('click', () => {
                if (contextMenuTarget) {
                    openRenameModal(contextMenuTarget);
                    closeContextMenu();
                }
            });

            document.querySelector('.delete-context').addEventListener('click', () => {
                if (contextMenuTarget) {
                    deleteChat(contextMenuTarget);
                    closeContextMenu();
                }
            });

            document.getElementById('renameCancel').addEventListener('click', closeRenameModal);
            document.getElementById('renameSave').addEventListener('click', saveRename);
            document.getElementById('renameInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') saveRename();
            });
        });
    </script>
</body>
</html>
